# cargo-deny: run in CI on every pull request (`cargo deny check`).

[graph]
all-features = true

[advisories]
# Any known vulnerability or unmaintained crate fails the check.
yanked = "deny"

[licenses]
# Licenses compatible with distributing the app under GPL-3.0 (ADR 0006).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

# libFuzzer, inside libfuzzer-sys, is under LLVM's former NCSA license, which is GPL-3.0 compatible. Only the fuzz
# targets use it, which are never shipped (ADR 0013); `cargo deny` checks their workspace with this file.
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

# The workspace's own crates are GPL-3.0-only and never published; their license is decided by ADR 0006, not here.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
