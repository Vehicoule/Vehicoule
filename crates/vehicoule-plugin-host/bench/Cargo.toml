# Benchmarks of the plugin host, counted by Callgrind through gungraun (ADR 0016). Run with `cargo bench` on Linux,
# with Valgrind and `gungraun-runner` installed at the version below, and the test plugins built by
# `scripts/build-plugin-fixtures.sh` into the directory named by `VEHICOULE_PLUGIN_FIXTURES`.
# Its own workspace, like the core's benchmarks: it is never shipped, and gungraun must not join the app's dependency
# graph.
[workspace]

[package]
name = "vehicoule-plugin-host-bench"
description = "Benchmarks of the plugin host: instruction counts of installing a plugin"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[dev-dependencies]
# The benchmark harness, at the version of the core's benchmarks. The `gungraun-runner` binary that runs the
# benchmarks must be installed at the same version.
gungraun = "=0.20.0"
vehicoule-plugin-host = { path = "..", version = "0.0.0" }

[[bench]]
name = "install"
harness = false
