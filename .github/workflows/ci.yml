name: CI

on:
  pull_request:
  push:
    branches: [main]
  # To run CI by hand on any branch from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install wasm-tools
        run: cargo install wasm-tools --version 1.263.0 --locked --no-default-features --features component
      - name: Build the plugin host's test plugins
        run: scripts/build-plugin-fixtures.sh "$RUNNER_TEMP/plugin-fixtures"
      - name: Check the test plugins' format
        run: cargo fmt --manifest-path crates/vehicoule-plugin-host/fixtures/Cargo.toml --check
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
        env:
          VEHICOULE_PLUGIN_FIXTURES: ${{ runner.temp }}/plugin-fixtures
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # ADR 0004: a mutant that survives the tests means a test that asserts too little, and fails the check.
  mutants:
    name: mutants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Install wasm-tools
        run: cargo install wasm-tools --version 1.263.0 --locked --no-default-features --features component
      - name: Build the plugin host's test plugins
        run: scripts/build-plugin-fixtures.sh "$RUNNER_TEMP/plugin-fixtures"
      - name: Mutation testing
        run: cargo mutants --workspace --cargo-arg=--locked
        env:
          VEHICOULE_PLUGIN_FIXTURES: ${{ runner.temp }}/plugin-fixtures

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # The plugin contract (docs/plugin-host-spec.md, section 8) must parse as a WIT package.
  wit:
    name: wit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install wasm-tools
        run: cargo install wasm-tools --version 1.263.0 --locked --no-default-features --features component
      - name: Parse the contract
        run: wasm-tools component wit wit/ > /dev/null
