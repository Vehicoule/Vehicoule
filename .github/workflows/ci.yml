name: CI

# common: header
on:
  pull_request:
  push:
    branches: [main]
  # To run CI by hand on any branch from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run on the older commit, which nobody needs any more. Each run on `main`
# has a group of its own, so a merge never cancels the run of the merge before it: every commit on `main` is
# checked, and its caches are saved.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
# end common: header

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debug information: each build compiles, links and caches less. Panics still name their file and line, and it
  # changes no code that runs.
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -D warnings

# Every checkout sets `persist-credentials: false`: no job pushes, so the token is not left on disk for the steps
# that run code from the pull request (zizmor's `artipacked` audit).
jobs:
  # common: changes
  # Sorts what a pull request changes, so that one changing only documentation does not take a runner for each check:
  # the jobs that need `changes` then skip, and GitHub counts a skipped job as passed, required or not. The checks
  # that read documentation too (spelling, licenses) do not need it and always run, and everything runs on `main` and
  # by hand. The jobs test `!= 'false'`, so a failure here makes them all run rather than skip.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.sort.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its first parent, the base: what the pull request changes.
          fetch-depth: 2
      - name: See whether the pull request changes more than documentation
        id: sort
        env:
          EVENT: ${{ github.event_name }}
          # Read by no build, test, proof or tool but typos and reuse. `.claude/` and `reference/` are not in it: some
          # repositories check them against a pinned source.
          DOCS: '^(docs/|LICENSES/|[^/]+\.md$|\.github/CODEOWNERS$|\.github/pull_request_template\.md$)'
        # `--no-renames` lists a moved file by its old path too, so moving one out of the code still counts.
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --no-renames --name-only HEAD^1 HEAD)
          echo "$changed"
          if [ -n "$changed" ] && ! grep -qvE "$DOCS" <<< "$changed"; then
            echo "Only documentation changes: the checks of the code skip."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
  # end common: changes

  check:
    name: check
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # Only `main` saves: pull requests read its entries and cannot share theirs, so their saves only took space from
      # `main`'s under the repository's cache limit.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install wasm-tools
        run: cargo install wasm-tools --version 1.263.0 --locked --no-default-features --features component
      - name: Build the plugin host's test plugins
        run: scripts/build-plugin-fixtures.sh "$RUNNER_TEMP/plugin-fixtures"
      - name: Check the test plugins' format
        run: cargo fmt --manifest-path crates/vehicoule-plugin-host/fixtures/Cargo.toml --check
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
        env:
          VEHICOULE_PLUGIN_FIXTURES: ${{ runner.temp }}/plugin-fixtures
      - name: Docs
        run: cargo doc --workspace --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # The app ships on macOS and Windows too (and Android, iOS and the web later): the workspace must build and pass its
  # tests there, not only on Linux. Same steps as `check`'s tests; format, lints and docs do not depend on the OS.
  platforms:
    name: test (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing platform must not hide another's failure.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        # The fixture script is bash; Windows runners ship it with Git.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install wasm-tools
        run: cargo install wasm-tools --version 1.263.0 --locked --no-default-features --features component
      - name: Build the plugin host's test plugins
        run: scripts/build-plugin-fixtures.sh "$RUNNER_TEMP/plugin-fixtures"
      - name: Test
        run: cargo test --workspace --locked
        env:
          VEHICOULE_PLUGIN_FIXTURES: ${{ runner.temp }}/plugin-fixtures

  # Android's armeabi-v7a is a 32-bit target, where `usize` has 32 bits: the no-overflow rule (AGENTS.md, rule 9) must
  # hold there too, and the other jobs only run 64-bit. i686 runs natively on the x86-64 runner, so no emulator is
  # needed. The test plugins are Wasm, so they build as in `check`.
  test-32-bit:
    name: test (i686)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain and its i686 target
        run: |
          rustup toolchain install
          rustup target add i686-unknown-linux-gnu
      - name: Install the 32-bit C runtime for linking
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install wasm-tools
        run: cargo install wasm-tools --version 1.263.0 --locked --no-default-features --features component
      - name: Build the plugin host's test plugins
        run: scripts/build-plugin-fixtures.sh "$RUNNER_TEMP/plugin-fixtures"
      - name: Test
        run: cargo test --workspace --target i686-unknown-linux-gnu --locked
        env:
          VEHICOULE_PLUGIN_FIXTURES: ${{ runner.temp }}/plugin-fixtures

  # ADR 0004: a mutant that survives the tests means a test that asserts too little, and fails the check.
  # The mutants are split into four shards that run side by side, each on its own runner: one runner took 10 to 19
  # minutes for the whole set. `--in-place` mutates this checkout instead of a copy, so the build reuses the `target/`
  # that rust-cache restored (a copy starts from an empty `target/`). Every shard runs the same command with the same
  # denominator, so together they test every mutant exactly once (cargo-mutants' `--shard k/n`). `round-robin` deals
  # the mutants out one by one: the default, `slice`, gave each shard a run of consecutive mutants, so the plugin
  # host's, whose tests take ten times longer, all fell in one shard (12 minutes, against 2 for two others).
  mutants-shard:
    name: mutants shard ${{ matrix.shard }}/4
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      # One failing shard must not hide the mutants the others miss.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Install wasm-tools
        run: cargo install wasm-tools --version 1.263.0 --locked --no-default-features --features component
      - name: Build the plugin host's test plugins
        run: scripts/build-plugin-fixtures.sh "$RUNNER_TEMP/plugin-fixtures"
      - name: Mutation testing
        run: cargo mutants --workspace --cargo-arg=--locked --in-place --sharding round-robin --shard ${{ matrix.shard }}/4
        env:
          VEHICOULE_PLUGIN_FIXTURES: ${{ runner.temp }}/plugin-fixtures

  # The required check: green only when every shard is. `always()` makes it run, and fail, when a shard fails or is
  # cancelled; without it, it would be skipped, and a skipped required check counts as passed.
  mutants:
    name: mutants
    needs: [changes, mutants-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULT: ${{ needs.mutants-shard.result }}
        # The shards skip, and this passes, only when `changes` found nothing but documentation.
        run: |
          echo "The shards' result: $RESULT"
          if [ "$CODE" = false ] && [ "$RESULT" = skipped ]; then
            echo "Only documentation changes: no shard to run."
            exit 0
          fi
          test "$RESULT" = success

  # ADR 0004: the core's invariants, proved by Kani on every pull request. CBMC proves one harness on one core, so
  # each shard proves as many harnesses at once as its runner has cores (`--jobs`), and the harnesses are split
  # across three shards. Seven shards proving one harness at a time took 8 minutes each, compiling the workspace
  # twice in each shard, and held seven of the account's runners.
  kani-shard:
    name: kani shard ${{ matrix.shard }}/3
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      # One failing shard must not hide the proofs the others fail.
      fail-fast: false
      matrix:
        # 3 shards, prime to the 4 starting lengths of each operation's proofs: the costly 3-entry proofs, one in
        # four of the sorted list, then land in every shard.
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Kani
        # `cargo kani setup` downloads the CBMC bundle and the nightly toolchain that this Kani version is built for.
        run: |
          cargo install kani-verifier --version 0.68.0 --locked
          cargo kani setup
      - name: Prove this shard's harnesses
        # Every harness is listed, so a new one is proved without editing this file. Each shard takes every 3rd of
        # the sorted list and checks that Kani verified exactly as many: an empty or short list must not pass. The
        # terse output keeps each harness's result and, when one fails, its failed checks, without the list of every
        # check that passed (200,000 lines a shard).
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 3
        run: |
          cargo kani list --format json
          contracts=$(jq '.totals."contract-harnesses"' kani-list.json)
          if [ "$contracts" != 0 ]; then
            echo "Found $contracts contract harnesses, which this job does not run yet."
            exit 1
          fi
          total=$(jq '.totals."standard-harnesses"' kani-list.json)
          mapfile -t harnesses < <(jq -r '."standard-harnesses"[][]' kani-list.json | LC_ALL=C sort \
            | awk -v shard="$SHARD" -v shards="$SHARDS" '(NR - 1) % shards == shard')
          count=${#harnesses[@]}
          echo "Shard $SHARD of $SHARDS: $count of $total harnesses."
          test "$total" -ge "$SHARDS"
          test "$count" -gt 0
          args=()
          for harness in "${harnesses[@]}"; do
            args+=(--harness "$harness")
          done
          cargo kani --workspace --exact --jobs "$(nproc)" --output-format terse "${args[@]}" | tee "$RUNNER_TEMP/kani.log"
          grep -qx "Complete - $count successfully verified harnesses, 0 failures, $count total." "$RUNNER_TEMP/kani.log"

  # The required check: green only when every shard is. `always()` makes it run, and fail, when a shard fails or is
  # cancelled; without it, it would be skipped, and a skipped required check counts as passed.
  kani:
    name: kani
    needs: [changes, kani-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULT: ${{ needs.kani-shard.result }}
        # The shards skip, and this passes, only when `changes` found nothing but documentation.
        run: |
          echo "The shards' result: $RESULT"
          if [ "$CODE" = false ] && [ "$RESULT" = skipped ]; then
            echo "Only documentation changes: no shard to run."
            exit 0
          fi
          test "$RESULT" = success

  # ADR 0013: fuzz targets for the plugin host's untrusted inputs, on the nightly toolchain that
  # `crates/vehicoule-plugin-host/fuzz/rust-toolchain.toml` pins. Each run is bounded by a number of inputs, never by
  # time, so its result does not depend on the runner's speed (AGENTS.md rule 7). Measured locally (4 cores,
  # cargo-fuzz's release profile, one run each): 200,000 inputs of `host_pattern` or `manifest` take 2 to 3 s;
  # `install` compiles each input and runs 13 inputs a second, so CI only replays the test plugins through it.
  fuzz:
    name: fuzz
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/vehicoule-plugin-host/fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchains
        # The stable one builds the test plugins and the tools; the nightly one, named in this directory, the targets.
        run: |
          (cd "$GITHUB_WORKSPACE" && rustup toolchain install)
          rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            crates/vehicoule-plugin-host/fixtures -> target
            crates/vehicoule-plugin-host/fuzz -> target
            crates/vehicoule-core/fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install wasm-tools and cargo-fuzz
        working-directory: .
        run: |
          cargo install wasm-tools --version 1.263.0 --locked --no-default-features --features component
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Build the plugin host's test plugins
        working-directory: .
        run: scripts/build-plugin-fixtures.sh "$RUNNER_TEMP/plugin-fixtures"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build the targets
        run: cargo fuzz build
      - name: Replay the test plugins through install
        # No mutation with `-runs=0`: every test plugin is installed once, and a panic or a crash fails the job.
        run: cargo fuzz run install "$RUNNER_TEMP/plugin-fixtures" -- -runs=0
      - name: Fuzz host patterns
        run: cargo fuzz run host_pattern -- -seed=1 -runs=200000
      - name: Fuzz manifests
        run: cargo fuzz run manifest -- -seed=1 -runs=200000
      # ADR 0015: the core's state machines, driven by sequences of operations, on the same nightly. 200,000 inputs of
      # `queue` took 23 s, then 79 s, locally (shared container, 4 cores, cargo-fuzz's release profile, two runs).
      - name: Check the format of the core's targets
        working-directory: crates/vehicoule-core/fuzz
        run: cargo fmt --check
      - name: Clippy on the core's targets
        working-directory: crates/vehicoule-core/fuzz
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Fuzz the queue
        working-directory: crates/vehicoule-core/fuzz
        run: cargo fuzz run queue -- -seed=1 -runs=200000
      - name: Fuzz the player
        working-directory: crates/vehicoule-core/fuzz
        run: cargo fuzz run player -- -seed=1 -runs=200000

  # ADR 0016: the benchmarks of the core and of the plugin host count instructions under Callgrind, which does not
  # depend on the runner's load, and each one fails above its ceiling. Valgrind is pinned to the version the counts
  # were recorded with: the install fails when the image no longer offers it, rather than counting with another one.
  # The core's 23 benchmarks took 7 s in CI after the build, and the job 2 min with the installs. The plugin host's
  # install benchmark takes 15 s locally (Valgrind 3.22.0, one run).
  bench:
    name: bench
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            crates/vehicoule-core/bench -> target
            crates/vehicoule-plugin-host/fixtures -> target
            crates/vehicoule-plugin-host/bench -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Valgrind, gungraun-runner and wasm-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind=1:3.22.0-0ubuntu3
          test "$(valgrind --version)" = valgrind-3.22.0
          cargo install gungraun-runner --version 0.20.0 --locked
          cargo install wasm-tools --version 1.263.0 --locked --no-default-features --features component
      - name: Build the plugin host's test plugins
        run: scripts/build-plugin-fixtures.sh "$RUNNER_TEMP/plugin-fixtures"
      - name: Format
        run: |
          (cd crates/vehicoule-core/bench && cargo fmt --check)
          (cd crates/vehicoule-plugin-host/bench && cargo fmt --check)
      - name: Clippy
        run: |
          (cd crates/vehicoule-core/bench && cargo clippy --all-targets --locked -- -D warnings)
          (cd crates/vehicoule-plugin-host/bench && cargo clippy --all-targets --locked -- -D warnings)
      - name: Run the core's benchmarks
        working-directory: crates/vehicoule-core/bench
        run: cargo bench --locked
      - name: Run the plugin host's benchmarks
        working-directory: crates/vehicoule-plugin-host/bench
        env:
          VEHICOULE_PLUGIN_FIXTURES: ${{ runner.temp }}/plugin-fixtures
        run: cargo bench --locked

  deny:
    name: deny
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      # The fuzz targets and the benchmarks are workspaces of their own (ADR 0013, ADR 0015, ADR 0016), checked with
      # the same `deny.toml`.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: crates/vehicoule-plugin-host/fuzz/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: crates/vehicoule-core/fuzz/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: crates/vehicoule-core/bench/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: crates/vehicoule-plugin-host/bench/Cargo.toml

  # The plugin contract (docs/plugin-host-spec.md, section 8) must parse as a WIT package.
  wit:
    name: wit
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The parent commit holds the contract this one is checked against.
          fetch-depth: 2
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install wasm-tools
        run: cargo install wasm-tools --version 1.263.0 --locked --no-default-features --features component
      - name: Parse the contract
        run: wasm-tools component wit wit/ > /dev/null
      - name: Test the compatibility check
        run: scripts/test-check-wit-compat.sh
      - name: Check the contract's version against the parent commit
        # On a pull request the checkout is GitHub's merge commit, whose first parent is the base branch; on `main` it
        # is the previous `main`.
        run: |
          mkdir "$RUNNER_TEMP/parent"
          git archive HEAD^1 wit | tar -x -C "$RUNNER_TEMP/parent"
          scripts/check-wit-compat.sh "$RUNNER_TEMP/parent/wit" wit

  # The reuse step of `lint` follows ADR 0009: every file in the repository has its copyright and license declared, in
  # REUSE.toml.
  # common: lint
  # The quick checks of the whole repository share one job, so a pull request waits for one runner instead of four.
  # Each check runs even when an earlier one failed, so one run reports every problem.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install typos, cargo-machete and zizmor
        run: |
          cargo install typos-cli --version 1.52.0 --locked
          cargo install cargo-machete --version 0.9.2 --locked
          cargo install zizmor --version 1.32.0 --locked
      # Spelling mistakes in code, comments and docs; everything in the repository is in English.
      - name: Spell check
        if: ${{ !cancelled() }}
        run: typos
      # A dependency no crate uses still widens the supply chain and the build (AGENTS.md, rule 11).
      - name: Find unused dependencies
        if: ${{ !cancelled() }}
        run: cargo machete
      # The workflows run code from every pull request with the repository's token: audit them for the known ways that
      # goes wrong (injection, leaked credentials, unpinned or impostor actions).
      - name: Audit the workflows
        if: ${{ !cancelled() }}
        # The token, read-only here, lets the online audits check the pinned actions against GitHub.
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor .github/workflows/
      # The layout Vehicoule's four repositories share: the common blocks of this file, and the checkouts' tokens.
      - name: Check the workflows' shared layout
        if: ${{ !cancelled() }}
        run: |
          scripts/test-check-workflows.sh
          scripts/check-workflows.sh
      - name: Check licensing (reuse 6.3.0)
        if: ${{ !cancelled() }}
        run: pipx run --spec reuse==6.3.0 reuse lint
  # end common: lint
