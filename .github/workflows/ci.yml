name: CI

on:
  pull_request:
  push:
    branches: [main]
  # To run CI by hand on any branch from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run on the older commit, which nobody needs any more. Each run on `main`
# has a group of its own, so a merge never cancels the run of the merge before it: every commit on `main` is
# checked, and its caches are saved.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debug information: each build compiles, links and caches less. Panics still name their file and line, and it
  # changes no code that runs.
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -D warnings

# Every checkout sets `persist-credentials: false`: no job pushes, so the token is not left on disk for the steps
# that run code from the pull request (zizmor's `artipacked` audit).
jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # Only `main` saves: pull requests read its entries and cannot share theirs, so their saves only took space from
      # `main`'s under the repository's cache limit.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install wasm-tools
        run: cargo install wasm-tools --version 1.263.0 --locked --no-default-features --features component
      - name: Build the plugin host's test plugins
        run: scripts/build-plugin-fixtures.sh "$RUNNER_TEMP/plugin-fixtures"
      - name: Check the test plugins' format
        run: cargo fmt --manifest-path crates/vehicoule-plugin-host/fixtures/Cargo.toml --check
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
        env:
          VEHICOULE_PLUGIN_FIXTURES: ${{ runner.temp }}/plugin-fixtures
      - name: Docs
        run: cargo doc --workspace --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # The app ships on macOS and Windows too (and Android, iOS and the web later): the workspace must build and pass its
  # tests there, not only on Linux. Same steps as `check`'s tests; format, lints and docs do not depend on the OS.
  platforms:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing platform must not hide another's failure.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        # The fixture script is bash; Windows runners ship it with Git.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install wasm-tools
        run: cargo install wasm-tools --version 1.263.0 --locked --no-default-features --features component
      - name: Build the plugin host's test plugins
        run: scripts/build-plugin-fixtures.sh "$RUNNER_TEMP/plugin-fixtures"
      - name: Test
        run: cargo test --workspace --locked
        env:
          VEHICOULE_PLUGIN_FIXTURES: ${{ runner.temp }}/plugin-fixtures

  # Android's armeabi-v7a is a 32-bit target, where `usize` has 32 bits: the no-overflow rule (AGENTS.md, rule 9) must
  # hold there too, and the other jobs only run 64-bit. i686 runs natively on the x86-64 runner, so no emulator is
  # needed. The test plugins are Wasm, so they build as in `check`.
  test-32-bit:
    name: test (i686)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain and its i686 target
        run: |
          rustup toolchain install
          rustup target add i686-unknown-linux-gnu
      - name: Install the 32-bit C runtime for linking
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install wasm-tools
        run: cargo install wasm-tools --version 1.263.0 --locked --no-default-features --features component
      - name: Build the plugin host's test plugins
        run: scripts/build-plugin-fixtures.sh "$RUNNER_TEMP/plugin-fixtures"
      - name: Test
        run: cargo test --workspace --target i686-unknown-linux-gnu --locked
        env:
          VEHICOULE_PLUGIN_FIXTURES: ${{ runner.temp }}/plugin-fixtures

  # ADR 0004: a mutant that survives the tests means a test that asserts too little, and fails the check.
  # The mutants are split into four shards that run side by side, each on its own runner: one runner took 10 to 19
  # minutes for the whole set. `--in-place` mutates this checkout instead of a copy, so the build reuses the `target/`
  # that rust-cache restored (a copy starts from an empty `target/`). Every shard runs the same command with the same
  # denominator, so together they test every mutant exactly once (cargo-mutants' `--shard k/n`).
  mutants-shard:
    name: mutants shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      # One failing shard must not hide the mutants the others miss.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Install wasm-tools
        run: cargo install wasm-tools --version 1.263.0 --locked --no-default-features --features component
      - name: Build the plugin host's test plugins
        run: scripts/build-plugin-fixtures.sh "$RUNNER_TEMP/plugin-fixtures"
      - name: Mutation testing
        run: cargo mutants --workspace --cargo-arg=--locked --in-place --shard ${{ matrix.shard }}/4
        env:
          VEHICOULE_PLUGIN_FIXTURES: ${{ runner.temp }}/plugin-fixtures

  # The required check: green only when every shard is. `always()` makes it run, and fail, when a shard fails or is
  # cancelled; without it, it would be skipped, and a skipped required check counts as passed.
  mutants:
    name: mutants
    needs: mutants-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.mutants-shard.result }}
        run: |
          echo "The shards' result: $RESULT"
          test "$RESULT" = success

  # ADR 0004: the core's invariants, proved by Kani on every pull request. The harnesses are split across shards,
  # since one job runs them one after the other.
  kani-shard:
    name: kani shard ${{ matrix.shard }}/7
    runs-on: ubuntu-latest
    strategy:
      # One failing shard must not hide the proofs the others fail.
      fail-fast: false
      matrix:
        # 7 shards, prime to the 4 starting lengths of each operation's proofs: the costly 3-entry proofs, one in
        # four of the sorted list, then land in every shard instead of in two.
        shard: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Kani
        # `cargo kani setup` downloads the CBMC bundle and the nightly toolchain that this Kani version is built for.
        run: |
          cargo install kani-verifier --version 0.68.0 --locked
          cargo kani setup
      - name: Prove this shard's harnesses
        # Every harness is listed, so a new one is proved without editing this file. Each shard takes every 7th of
        # the sorted list and checks that Kani verified exactly as many: an empty or short list must not pass.
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 7
        run: |
          cargo kani list --format json
          contracts=$(jq '.totals."contract-harnesses"' kani-list.json)
          if [ "$contracts" != 0 ]; then
            echo "Found $contracts contract harnesses, which this job does not run yet."
            exit 1
          fi
          total=$(jq '.totals."standard-harnesses"' kani-list.json)
          mapfile -t harnesses < <(jq -r '."standard-harnesses"[][]' kani-list.json | LC_ALL=C sort \
            | awk -v shard="$SHARD" -v shards="$SHARDS" '(NR - 1) % shards == shard')
          count=${#harnesses[@]}
          echo "Shard $SHARD of $SHARDS: $count of $total harnesses."
          test "$total" -ge "$SHARDS"
          test "$count" -gt 0
          args=()
          for harness in "${harnesses[@]}"; do
            args+=(--harness "$harness")
          done
          cargo kani --workspace --exact "${args[@]}" | tee "$RUNNER_TEMP/kani.log"
          grep -qx "Complete - $count successfully verified harnesses, 0 failures, $count total." "$RUNNER_TEMP/kani.log"

  # The required check: green only when every shard is. `always()` makes it run, and fail, when a shard fails or is
  # cancelled; without it, it would be skipped, and a skipped required check counts as passed.
  kani:
    name: kani
    needs: kani-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.kani-shard.result }}
        run: |
          echo "The shards' result: $RESULT"
          test "$RESULT" = success

  # ADR 0013: fuzz targets for the plugin host's untrusted inputs, on the nightly toolchain that
  # `crates/vehicoule-plugin-host/fuzz/rust-toolchain.toml` pins. Each run is bounded by a number of inputs, never by
  # time, so its result does not depend on the runner's speed (AGENTS.md rule 7). Measured locally (4 cores,
  # cargo-fuzz's release profile, one run each): 200,000 inputs of `host_pattern` or `manifest` take 2 to 3 s;
  # `install` compiles each input and runs 13 inputs a second, so CI only replays the test plugins through it.
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/vehicoule-plugin-host/fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchains
        # The stable one builds the test plugins and the tools; the nightly one, named in this directory, the targets.
        run: |
          (cd "$GITHUB_WORKSPACE" && rustup toolchain install)
          rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            crates/vehicoule-plugin-host/fixtures -> target
            crates/vehicoule-plugin-host/fuzz -> target
            crates/vehicoule-core/fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install wasm-tools and cargo-fuzz
        working-directory: .
        run: |
          cargo install wasm-tools --version 1.263.0 --locked --no-default-features --features component
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Build the plugin host's test plugins
        working-directory: .
        run: scripts/build-plugin-fixtures.sh "$RUNNER_TEMP/plugin-fixtures"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build the targets
        run: cargo fuzz build
      - name: Replay the test plugins through install
        # No mutation with `-runs=0`: every test plugin is installed once, and a panic or a crash fails the job.
        run: cargo fuzz run install "$RUNNER_TEMP/plugin-fixtures" -- -runs=0
      - name: Fuzz host patterns
        run: cargo fuzz run host_pattern -- -seed=1 -runs=200000
      - name: Fuzz manifests
        run: cargo fuzz run manifest -- -seed=1 -runs=200000
      # ADR 0015: the core's state machines, driven by sequences of operations, on the same nightly. 200,000 inputs of
      # `queue` took 23 s, then 79 s, locally (shared container, 4 cores, cargo-fuzz's release profile, two runs).
      - name: Check the format of the core's targets
        working-directory: crates/vehicoule-core/fuzz
        run: cargo fmt --check
      - name: Clippy on the core's targets
        working-directory: crates/vehicoule-core/fuzz
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Fuzz the queue
        working-directory: crates/vehicoule-core/fuzz
        run: cargo fuzz run queue -- -seed=1 -runs=200000

  # ADR 0016: the core's benchmarks count instructions under Callgrind, which does not depend on the runner's load,
  # and each one fails above its ceiling. The runner's image is pinned so that Valgrind's version stays the same.
  # The first run of its 19 benchmarks took 6 s after the build, and the job 1.5 min with the installs.
  bench:
    name: bench
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/vehicoule-core/bench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/vehicoule-core/bench -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Valgrind and gungraun-runner
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          valgrind --version
          cargo install gungraun-runner --version 0.20.0 --locked
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run the benchmarks
        run: cargo bench --locked

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      # The fuzz targets and the benchmarks are workspaces of their own (ADR 0013, ADR 0015, ADR 0016), checked with
      # the same `deny.toml`.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: crates/vehicoule-plugin-host/fuzz/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: crates/vehicoule-core/fuzz/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: crates/vehicoule-core/bench/Cargo.toml

  # The plugin contract (docs/plugin-host-spec.md, section 8) must parse as a WIT package.
  wit:
    name: wit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The parent commit holds the contract this one is checked against.
          fetch-depth: 2
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install wasm-tools
        run: cargo install wasm-tools --version 1.263.0 --locked --no-default-features --features component
      - name: Parse the contract
        run: wasm-tools component wit wit/ > /dev/null
      - name: Test the compatibility check
        run: scripts/test-check-wit-compat.sh
      - name: Check the contract's version against the parent commit
        # On a pull request the checkout is GitHub's merge commit, whose first parent is the base branch; on `main` it
        # is the previous `main`.
        run: |
          mkdir "$RUNNER_TEMP/parent"
          git archive HEAD^1 wit | tar -x -C "$RUNNER_TEMP/parent"
          scripts/check-wit-compat.sh "$RUNNER_TEMP/parent/wit" wit

  # Spelling mistakes in code, comments and docs; everything in the repository is in English.
  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install typos
        run: cargo install typos-cli --version 1.52.0 --locked
      - name: Spell check
        run: typos

  # A dependency no crate uses still widens the supply chain and the build (AGENTS.md, rule 11).
  machete:
    name: machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-machete
        run: cargo install cargo-machete --version 0.9.2 --locked
      - name: Find unused dependencies
        run: cargo machete

  # The workflows run code from every pull request with the repository's token: audit them for the known ways that
  # goes wrong (injection, leaked credentials, unpinned or impostor actions).
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install zizmor
        run: cargo install zizmor --version 1.32.0 --locked
      - name: Audit the workflows
        # The token, read-only here, lets the online audits check the pinned actions against GitHub.
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor .github/workflows/
