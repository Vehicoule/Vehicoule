# Licensing of every file in the repository, checked by `reuse lint` (ADR 0009).
# A file no annotation covers fails the check: a new top-level path, or a vendored file, needs its own entry.
version = 1

[[annotations]]
path = [
    ".cargo/**",
    ".github/**",
    ".gitignore",
    "AGENTS.md",
    "CLAUDE.md",
    "Cargo.lock",
    "Cargo.toml",
    "README.md",
    "REUSE.toml",
    "SECURITY.md",
    "_typos.toml",
    "clippy.toml",
    "crates/**",
    "deny.toml",
    "docs/**",
    "rust-toolchain.toml",
    "rustfmt.toml",
    "scripts/**",
    "wit/**",
]
precedence = "override"
SPDX-FileCopyrightText = "The Vehicoule contributors"
SPDX-License-Identifier = "GPL-3.0-only"

# Vendored sources keep their own license (ADR 0006); their provenance files say where they come from.
[[annotations]]
path = ["reference/README.md", ".claude/skills/PROVENANCE.md"]
precedence = "override"
SPDX-FileCopyrightText = "The Vehicoule contributors"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = "reference/rust/google-rust-style-guide.md"
precedence = "override"
SPDX-FileCopyrightText = "Google"
SPDX-License-Identifier = "CC-BY-3.0"

[[annotations]]
path = ".claude/skills/rust-best-practices/**"
precedence = "override"
SPDX-FileCopyrightText = "Apollo GraphQL"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ".claude/skills/rust-coding-guidelines/**"
precedence = "override"
SPDX-FileCopyrightText = "The authors of https://github.com/actionbook/rust-skills"
SPDX-License-Identifier = "MIT"
